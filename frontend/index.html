<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valhalla — Multi-Agent Map</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: system-ui, -apple-system, sans-serif; }
  canvas { display: block; cursor: grab; }
  canvas:active { cursor: grabbing; }

  #panel {
    position: absolute;
    top: 16px; left: 16px;
    background: rgba(0,0,0,0.78);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 12px 14px;
    color: #ddd;
    font-size: 13px;
    min-width: 280px;
    max-width: 300px;
    user-select: none;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  #agentList {
    max-height: 340px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  #agentList::-webkit-scrollbar { width: 4px; }
  #agentList::-webkit-scrollbar-track { background: transparent; }
  #agentList::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

  .agent-row {
    display: flex;
    align-items: center;
    gap: 3px;
    font-size: 11px;
    padding: 2px 4px;
    border-radius: 4px;
    background: rgba(255,255,255,0.02);
  }
  .agent-row:hover { background: rgba(255,255,255,0.06); }

  .agent-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .agent-num {
    color: #888;
    font-size: 9px;
    width: 12px;
    text-align: right;
    flex-shrink: 0;
    font-family: monospace;
  }

  .agent-row input {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 3px;
    color: #ddd;
    padding: 2px 2px;
    width: 32px;
    font-size: 9px;
    font-family: monospace;
    text-align: center;
  }
  .agent-row input:focus { outline: none; border-color: #4a9eff; }
  .comma { color: #555; font-size: 8px; }
  .arrow { color: #555; font-size: 9px; }
  .agent-go {
    background: #2a7de1;
    border: none;
    border-radius: 3px;
    color: #fff;
    padding: 2px 6px;
    font-size: 9px;
    cursor: pointer;
    font-weight: 600;
    transition: background .15s;
    flex-shrink: 0;
    line-height: 1.3;
  }
  .agent-go:hover { background: #3d8ef5; }
  .agent-go:disabled { opacity: .4; cursor: not-allowed; }

  .agent-dot-status {
    width: 6px; height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-left: 1px;
  }
  .agent-dot-status.idle { background: #555; }
  .agent-dot-status.busy { background: #f5a623; animation: pulse .8s infinite; }
  .agent-dot-status.done { background: #2ecc71; }
  .agent-dot-status.err { background: #e74c3c; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  #info {
    position: absolute;
    bottom: 16px; left: 16px;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 8px 14px;
    color: #aaa;
    font-size: 11px;
    font-family: monospace;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  #infoRow { display: flex; gap: 12px; flex-wrap: wrap; }
  #infoRow span { display: flex; align-items: center; gap: 4px; }
  .mini-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; }
</style>
</head>
<body>

<canvas id="map"></canvas>

<div id="panel">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px">
    <span style="font-weight:600;font-size:13px;color:#fff">Valhalla</span>
    <div style="display:flex;gap:4px">
      <button id="runAllBtn" style="padding:2px 10px;font-size:11px">▶ Run All</button>
      <button id="stopAllBtn" style="padding:2px 10px;font-size:11px">■ Stop</button>
    </div>
  </div>
  <div id="agentList"></div>
</div>

<div id="info">
  <div id="infoCoords">—</div>
  <div id="infoRow"></div>
</div>

<script>
(async () => {

// ── Canvas setup ──────────────────────────────────────────
const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  draw();
}
window.addEventListener('resize', resize);

// ── Map image ─────────────────────────────────────────────
const mapImg = new Image();
mapImg.src = '/map.png';
await mapImg.decode();

// ── Camera state ──────────────────────────────────────────
let offsetX = 0, offsetY = 0, scale = 1;
let isDragging = false, dragStartX, dragStartY, dragOffX, dragOffY;

function fitMap() {
  const iw = mapImg.width, ih = mapImg.height;
  const sx = W / iw, sy = H / ih;
  scale = Math.min(sx, sy) * 0.92;
  offsetX = (W - iw * scale) / 2;
  offsetY = (H - ih * scale) / 2;
  draw();
}

function screenToMap(sx, sy) {
  return [(sx - offsetX) / scale, (sy - offsetY) / scale];
}
function mapToScreen(mx, my) {
  return [mx * scale + offsetX, my * scale + offsetY];
}

canvas.addEventListener('mousedown', e => {
  isDragging = true;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  dragOffX = offsetX;
  dragOffY = offsetY;
});
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  offsetX = dragOffX + (e.clientX - dragStartX);
  offsetY = dragOffY + (e.clientY - dragStartY);
  draw();
});
window.addEventListener('mouseup', () => { isDragging = false; });

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
  const newScale = scale * zoomFactor;
  if (newScale < 0.1 || newScale > 50) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const [mapX, mapY] = screenToMap(mx, my);
  scale = newScale;
  offsetX = mx - mapX * scale;
  offsetY = my - mapY * scale;
  draw();
}, { passive: false });

// ── Agent configuration ───────────────────────────────────
const AGENT_COLORS = [
  '#ffcc33', '#ff6b6b', '#51cf66', '#339af0', '#cc5de8',
  '#f76707', '#20c997', '#f06595', '#748ffc', '#ffd43b',
];

const agents = AGENT_COLORS.map((color, i) => ({
  color,
  idx: i,
  x1: 32, y1: 297,
  x2: 0, y2: 0,
  bldName: '',
  path: [],
  ballX: 0, ballY: 0,
  animating: false,
  animPos: 0,
  animStartTime: 0,
  done: false,
}));

// ── Build agent UI rows ───────────────────────────────────
const agentList = document.getElementById('agentList');
agents.forEach((a) => {
  const row = document.createElement('div');
  row.className = 'agent-row';
  row.dataset.idx = a.idx;
  row.innerHTML = `
    <span class="agent-dot" style="background:${a.color}"></span>
    <span class="agent-num">${a.idx+1}</span>
    <input class="ax1" value="${a.x1}" type="number" min="0" max="2000">
    <span class="comma">,</span>
    <input class="ay1" value="${a.y1}" type="number" min="0" max="2000">
    <span class="arrow">→</span>
    <input class="ax2" value="${a.x2}" type="number" min="0" max="2000">
    <span class="comma">,</span>
    <input class="ay2" value="${a.y2}" type="number" min="0" max="2000">
    <button class="agent-go">Go</button>
    <span class="agent-dot-status idle"></span>
  `;
  agentList.appendChild(row);
});

async function fetchEntrypoints() {
  try {
    const res = await fetch('/api/entrypoints');
    const data = await res.json();
    const entries = Object.values(data);
    entries.sort((a, b) => a.building_num - b.building_num);
    agents.forEach((a, i) => {
      if (i < entries.length) {
        a.x2 = entries[i].x;
        a.y2 = entries[i].y;
        a.bldName = entries[i].name;
        const row = agentList.querySelectorAll('.agent-row')[i];
        if (row) {
          row.querySelector('.ax2').value = a.x2;
          row.querySelector('.ay2').value = a.y2;
        }
      }
    });
    draw();
  } catch {}
}

function readAgentInputs() {
  const rows = document.querySelectorAll('.agent-row');
  rows.forEach((row, i) => {
    const x1 = parseInt(row.querySelector('.ax1').value) || 0;
    const y1 = parseInt(row.querySelector('.ay1').value) || 0;
    const x2 = parseInt(row.querySelector('.ax2').value) || 0;
    const y2 = parseInt(row.querySelector('.ay2').value) || 0;
    agents[i].x1 = x1; agents[i].y1 = y1;
    agents[i].x2 = x2; agents[i].y2 = y2;
  });
}

function setAgentStatus(idx, state) {
  const rows = document.querySelectorAll('.agent-row');
  const dot = rows[idx]?.querySelector('.agent-dot-status');
  if (dot) dot.className = 'agent-dot-status ' + state;
}

// ── Buildings ─────────────────────────────────────────────
let buildings = [];
let buildingsLoaded = false;

// ── Drawing ────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(offsetX, offsetY);
  ctx.scale(scale, scale);

  ctx.drawImage(mapImg, 0, 0);

  if (buildingsLoaded) {
    for (const b of buildings) {
      ctx.fillStyle = 'rgba(255,0,0,0.30)';
      ctx.fillRect(b.x, b.y, b.w, b.h);
    }

    const bbox = {};
    for (const b of buildings) {
      const key = b.id;
      if (!bbox[key]) bbox[key] = { x1: Infinity, y1: Infinity, x2: -Infinity, y2: -Infinity, label: b.label };
      const bb = bbox[key];
      if (b.x < bb.x1) bb.x1 = b.x;
      if (b.y < bb.y1) bb.y1 = b.y;
      if (b.x + b.w > bb.x2) bb.x2 = b.x + b.w;
      if (b.y + b.h > bb.y2) bb.y2 = b.y + b.h;
    }

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 9px monospace';
    for (const bb of Object.values(bbox)) {
      const cx = (bb.x1 + bb.x2) / 2;
      const cy = (bb.y1 + bb.y2) / 2;
      const m = ctx.measureText(bb.label);
      const pad = 3;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(cx - m.width / 2 - pad, cy - 7 - pad, m.width + pad * 2, 14 + pad * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.fillText(bb.label, cx, cy);
    }
    ctx.textAlign = 'start';
    ctx.textBaseline = 'alphabetic';
  }

  // Agent paths
  for (const a of agents) {
    if (a.path.length > 1) {
      ctx.beginPath();
      ctx.moveTo(a.path[0][0], a.path[0][1]);
      for (let i = 1; i < a.path.length; i++) {
        ctx.lineTo(a.path[i][0], a.path[i][1]);
      }
      ctx.strokeStyle = a.color + '70';
      ctx.lineWidth = 1.5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();
    }
  }

  // Start / end markers
  ctx.font = 'bold 9px monospace';
  if (agents.some(a => a.path.length > 1)) {
    ctx.beginPath();
    ctx.arc(32, 297, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#00cc66';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#00cc66';
    ctx.fillText('S', 39, 300);
  }

  for (const a of agents) {
    if (a.path.length < 2) continue;
    const [ex, ey] = a.path[a.path.length - 1];

    ctx.beginPath();
    ctx.arc(ex, ey, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#3399ff';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#3399ff';
    ctx.fillText(`E${a.idx+1}`, ex + 7, ey + 3);
  }

  // Agent balls
  for (const a of agents) {
    if (a.path.length < 2) continue;
    if (a.ballX === 0 && a.ballY === 0) continue;

    const glow = ctx.createRadialGradient(a.ballX, a.ballY, 0, a.ballX, a.ballY, 11);
    glow.addColorStop(0, a.color + '50');
    glow.addColorStop(1, a.color + '00');
    ctx.beginPath();
    ctx.arc(a.ballX, a.ballY, 11, 0, Math.PI * 2);
    ctx.fillStyle = glow;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(a.ballX, a.ballY, 4, 0, Math.PI * 2);
    ctx.fillStyle = a.color;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 8px monospace';
    ctx.fillText(`${a.idx+1}`, a.ballX + 6, a.ballY + 3);
  }

  ctx.restore();
}

// ── Animation ──────────────────────────────────────────────
const PIXELS_PER_SEC = 100;
let animFrameId = null;
let animatingAny = false;

function pathLength(path) {
  let len = 0;
  for (let i = 1; i < path.length; i++) {
    len += Math.hypot(path[i][0] - path[i-1][0], path[i][1] - path[i-1][1]);
  }
  return len;
}

function startGlobalAnim() {
  if (animFrameId) cancelAnimationFrame(animFrameId);
  animatingAny = true;
  animFrameId = requestAnimationFrame(globalAnimate);
}

function stopAll() {
  animatingAny = false;
  if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
  for (const a of agents) {
    a.animating = false;
    if (a.path.length > 0) {
      a.ballX = a.path[0][0];
      a.ballY = a.path[0][1];
    }
    a.done = false;
    setAgentStatus(a.idx, 'idle');
  }
  updateInfoRow();
  draw();
}

function globalAnimate(timestamp) {
  let anyStillMoving = false;

  for (const a of agents) {
    if (!a.animating || a.path.length < 2) continue;

    const elapsed = (timestamp - a.animStartTime) / 1000;
    const targetDist = elapsed * PIXELS_PER_SEC;
    const totalLen = pathLength(a.path);

    if (totalLen === 0) {
      a.animating = false;
      a.done = true;
      setAgentStatus(a.idx, 'done');
      continue;
    }

    if (targetDist >= totalLen) {
      a.ballX = a.path[a.path.length - 1][0];
      a.ballY = a.path[a.path.length - 1][1];
      a.animating = false;
      a.done = true;
      setAgentStatus(a.idx, 'done');
      continue;
    }

    anyStillMoving = true;

    let accumulated = 0;
    let prevX = a.path[0][0], prevY = a.path[0][1];
    for (let i = 1; i < a.path.length; i++) {
      const [px, py] = a.path[i];
      const segLen = Math.hypot(px - prevX, py - prevY);
      if (accumulated + segLen >= targetDist) {
        const frac = (targetDist - accumulated) / segLen;
        a.ballX = prevX + (px - prevX) * frac;
        a.ballY = prevY + (py - prevY) * frac;
        a.animPos = i;
        break;
      }
      accumulated += segLen;
      prevX = px; prevY = py;
    }
  }

  updateInfoRow();
  draw();

  if (anyStillMoving) {
    animFrameId = requestAnimationFrame(globalAnimate);
  } else {
    animatingAny = false;
    animFrameId = null;
  }
}

// ── Info ──────────────────────────────────────────────────
function updateInfoRow() {
  const el = document.getElementById('infoRow');
  const running = agents.filter(a => a.animating).length;
  const finished = agents.filter(a => a.done).length;
  el.innerHTML = `
    <span><span class="mini-dot" style="background:#f5a623"></span> ${running}</span>
    <span><span class="mini-dot" style="background:#2ecc71"></span> ${finished}</span>
    <span style="color:#555">|</span>
    <span>${agents.length} agents</span>
  `;
}

// ── Path fetching ─────────────────────────────────────────
async function goAgent(idx) {
  readAgentInputs();
  const a = agents[idx];
  setAgentStatus(idx, 'busy');

  try {
    const res = await fetch(`/api/path?x1=${a.x1}&y1=${a.y1}&x2=${a.x2}&y2=${a.y2}`);
    if (!res.ok) { setAgentStatus(idx, 'err'); return; }
    const data = await res.json();
    a.path = data.path || [];
    if (a.path.length > 0) {
      a.ballX = a.path[0][0];
      a.ballY = a.path[0][1];
      a.animating = true;
      a.animStartTime = performance.now();
      a.done = false;
      setAgentStatus(idx, 'busy');
      if (!animatingAny) startGlobalAnim();
    } else {
      setAgentStatus(idx, 'err');
    }
  } catch {
    setAgentStatus(idx, 'err');
  }
  updateInfoRow();
  draw();
}

async function runAll() {
  readAgentInputs();
  document.getElementById('runAllBtn').disabled = true;

  let results;

  // Batch endpoint
  try {
    const res = await fetch('/api/paths', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        agents: agents.map(a => ({ x1: a.x1, y1: a.y1, x2: a.x2, y2: a.y2 }))
      }),
    });
    if (!res.ok) throw new Error('batch failed');
    const data = await res.json();
    results = data.paths;
  } catch {
    // Fallback: individual parallel calls
    results = await Promise.all(agents.map(async (a) => {
      try {
        const r = await fetch(`/api/path?x1=${a.x1}&y1=${a.y1}&x2=${a.x2}&y2=${a.y2}`);
        return r.ok ? await r.json() : { path: [] };
      } catch { return { path: [] }; }
    }));
  }

  agents.forEach((a, i) => {
    a.path = results[i]?.path || [];
    if (a.path.length > 0) {
      a.ballX = a.path[0][0];
      a.ballY = a.path[0][1];
      a.animating = a.path.length > 1;
      a.animStartTime = performance.now();
      a.animPos = 0;
      a.done = false;
      setAgentStatus(i, a.path.length > 1 ? 'busy' : 'err');
    } else {
      setAgentStatus(i, 'err');
    }
  });

  document.getElementById('runAllBtn').disabled = false;
  updateInfoRow();
  draw();
  startGlobalAnim();
}

// ── Event wiring ──────────────────────────────────────────
document.getElementById('runAllBtn').addEventListener('click', runAll);
document.getElementById('stopAllBtn').addEventListener('click', stopAll);

agentList.addEventListener('click', e => {
  const btn = e.target.closest('.agent-go');
  if (btn) {
    const row = btn.closest('.agent-row');
    if (row) goAgent(parseInt(row.dataset.idx));
  }
});

agentList.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const row = e.target.closest('.agent-row');
    if (row) {
      const btn = row.querySelector('.agent-go');
      if (btn) goAgent(parseInt(row.dataset.idx));
    }
  }
});

// ── WebSocket (future) ────────────────────────────────────
let ws = null;
function connectWS() {
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${protocol}//${location.host}/ws`);
  ws.onopen = () => {};
  ws.onclose = () => setTimeout(connectWS, 3000);
  ws.onerror = () => ws?.close();
  ws.onmessage = (e) => {
    try { const msg = JSON.parse(e.data); } catch {}
  };
}

// ── Init ──────────────────────────────────────────────────
resize();
fitMap();
connectWS();

fetch('/api/buildings')
  .then(r => r.json())
  .then(data => { buildings = data; buildingsLoaded = true; draw(); })
  .catch(() => {});

// Load entrypoints, then launch first agent
fetchEntrypoints().then(() => {
  setTimeout(() => goAgent(0), 200);
});

})();
</script>
</body>
</html>
