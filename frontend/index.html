<!DOCTYPE html>
<!--
Valhalla map frontend — single-page web app with zoom/pan canvas,
pathfinding UI, and ball animation. Fetches paths from the backend
(/api/path), renders them over map.png, and maintains a WebSocket
connection (/ws) ready for real-time multi-agent updates.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valhalla — Agent Map</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: system-ui, -apple-system, sans-serif; }
  canvas { display: block; cursor: grab; }
  canvas:active { cursor: grabbing; }

  #panel {
    position: absolute;
    top: 16px; left: 16px;
    background: rgba(0,0,0,0.78);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 14px 16px;
    color: #ddd;
    font-size: 13px;
    min-width: 240px;
    user-select: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #panel .row { display: flex; gap: 6px; align-items: center; }
  #panel label { color: #999; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
  #panel input {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 5px;
    color: #eee;
    padding: 4px 6px;
    width: 56px;
    font-size: 12px;
    font-family: monospace;
  }
  #panel input:focus { outline: none; border-color: #4a9eff; }
  #panel button {
    background: #2a7de1;
    border: none;
    border-radius: 5px;
    color: #fff;
    padding: 5px 14px;
    font-size: 12px;
    cursor: pointer;
    font-weight: 600;
    transition: background .15s;
  }
  #panel button:hover { background: #3d8ef5; }
  #panel button:disabled { opacity: .4; cursor: not-allowed; }

  #info {
    position: absolute;
    bottom: 16px; left: 16px;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 8px 14px;
    color: #aaa;
    font-size: 12px;
    font-family: monospace;
    pointer-events: none;
  }

  .status-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .status-dot.idle { background: #555; }
  .status-dot.busy { background: #f5a623; animation: pulse .8s infinite; }
  .status-dot.done { background: #2ecc71; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  .coord-label { color: #777; font-size: 10px; }
</style>
</head>
<body>

<canvas id="map"></canvas>

<div id="panel">
  <div style="font-weight:600;font-size:14px;color:#fff;margin-bottom:2px">Valhalla</div>
  <div class="row">
    <label>From</label>
    <input id="x1" value="32" type="number"> <span style="color:#555">,</span>
    <input id="y1" value="297" type="number">
    <span class="coord-label">S</span>
  </div>
  <div class="row">
    <label>To</label>
    <input id="x2" value="959" type="number"> <span style="color:#555">,</span>
    <input id="y2" value="1205" type="number">
    <span class="coord-label">E</span>
  </div>
  <div class="row" style="justify-content:space-between">
    <button id="goBtn">Go</button>
    <span id="statusText" style="font-size:11px;color:#888;display:flex;align-items:center">
      <span class="status-dot idle" id="statusDot"></span>
      <span id="statusLabel">idle</span>
    </span>
  </div>
</div>

<div id="info">
  <div id="infoCoords">—</div>
  <div id="infoProgress"></div>
</div>

<script>
(async () => {

// ── Canvas setup ──────────────────────────────────────────
const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  draw();
}
window.addEventListener('resize', resize);

// ── Map image ─────────────────────────────────────────────
const mapImg = new Image();
mapImg.src = '/map.png';
await mapImg.decode();

// ── Camera state ──────────────────────────────────────────
let offsetX = 0, offsetY = 0, scale = 1;
let isDragging = false, dragStartX, dragStartY, dragOffX, dragOffY;

function fitMap() {
  const iw = mapImg.width, ih = mapImg.height;
  const sx = W / iw, sy = H / ih;
  scale = Math.min(sx, sy) * 0.92;
  offsetX = (W - iw * scale) / 2;
  offsetY = (H - ih * scale) / 2;
  draw();
}

// ── Coordinate transforms ─────────────────────────────────
function screenToMap(sx, sy) {
  return [(sx - offsetX) / scale, (sy - offsetY) / scale];
}
function mapToScreen(mx, my) {
  return [mx * scale + offsetX, my * scale + offsetY];
}

// ── Mouse / touch events ──────────────────────────────────
canvas.addEventListener('mousedown', e => {
  isDragging = true;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  dragOffX = offsetX;
  dragOffY = offsetY;
});
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  offsetX = dragOffX + (e.clientX - dragStartX);
  offsetY = dragOffY + (e.clientY - dragStartY);
  draw();
});
window.addEventListener('mouseup', () => { isDragging = false; });

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
  const newScale = scale * zoomFactor;
  if (newScale < 0.1 || newScale > 50) return;

  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  const [mapX, mapY] = screenToMap(mx, my);
  scale = newScale;
  offsetX = mx - mapX * scale;
  offsetY = my - mapY * scale;
  draw();
}, { passive: false });

// ── Path state ────────────────────────────────────────────
let pathPoints = [];
let animating = false;
let animPos = 0;
let ballX = 0, ballY = 0;
let animId = null;
let animStartTime = 0;
let ws = null;

// ── Buildings ─────────────────────────────────────────────
let buildings = [];
let buildingsLoaded = false;

// ── Drawing ────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, W, H);

  // Dark background
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(offsetX, offsetY);
  ctx.scale(scale, scale);

  // Map
  ctx.drawImage(mapImg, 0, 0);

  // Buildings
  if (buildingsLoaded) {
    ctx.font = 'bold 10px monospace';
    const labelDrawn = new Set();
    for (const b of buildings) {
      ctx.fillStyle = 'rgba(255,0,0,0.30)';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      if (!labelDrawn.has(b.label)) {
        labelDrawn.add(b.label);
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.strokeStyle = 'rgba(150,0,0,0.5)';
        ctx.lineWidth = 1;
        ctx.strokeText(b.label, b.x + 2, b.y - 3);
        ctx.fillText(b.label, b.x + 2, b.y - 3);
      }
    }
  }

  // Path line
  if (pathPoints.length > 1) {
    ctx.beginPath();
    ctx.moveTo(pathPoints[0][0], pathPoints[0][1]);
    for (let i = 1; i < pathPoints.length; i++) {
      ctx.lineTo(pathPoints[i][0], pathPoints[i][1]);
    }
    ctx.strokeStyle = 'rgba(255,50,50,0.55)';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
  }

  // Start marker
  if (pathPoints.length > 0) {
    const [sx, sy] = pathPoints[0];
    ctx.beginPath();
    ctx.arc(sx, sy, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#00cc66';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#00cc66';
    ctx.font = 'bold 11px monospace';
    ctx.fillText('S', sx + 9, sy + 4);
  }

  // End marker
  if (pathPoints.length > 0) {
    const [ex, ey] = pathPoints[pathPoints.length - 1];
    ctx.beginPath();
    ctx.arc(ex, ey, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#3399ff';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#3399ff';
    ctx.font = 'bold 11px monospace';
    ctx.fillText('E', ex + 9, ey + 4);
  }

  // Ball (agent)
  if (pathPoints.length > 1 && animating) {
    const glow = ctx.createRadialGradient(ballX, ballY, 0, ballX, ballY, 12);
    glow.addColorStop(0, 'rgba(255,180,50,0.35)');
    glow.addColorStop(1, 'rgba(255,180,50,0)');
    ctx.beginPath();
    ctx.arc(ballX, ballY, 12, 0, Math.PI * 2);
    ctx.fillStyle = glow;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(ballX, ballY, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#ffcc33';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  ctx.restore();
}

// ── Ball animation ────────────────────────────────────────
const PIXELS_PER_SEC = 100;

function startAnimation() {
  if (pathPoints.length < 2) return;
  animating = true;
  animPos = 0;
  ballX = pathPoints[0][0];
  ballY = pathPoints[0][1];
  if (animId) cancelAnimationFrame(animId);
  animStartTime = performance.now();

  animate();
}

function animate() {
  if (!animating) { draw(); return; }

  const elapsed = (performance.now() - animStartTime) / 1000;
  const targetDist = elapsed * PIXELS_PER_SEC;
  const totalLen = pathLength();
  if (totalLen === 0) { animating = false; setStatus('idle'); draw(); return; }

  if (targetDist >= totalLen) {
    ballX = pathPoints[pathPoints.length - 1][0];
    ballY = pathPoints[pathPoints.length - 1][1];
    animating = false;
    setStatus('done');
    updateInfo();
    draw();
    return;
  }

  // Walk along the path to find the position at targetDist
  let accumulated = 0;
  let prevX = pathPoints[0][0], prevY = pathPoints[0][1];
  for (let i = 1; i < pathPoints.length; i++) {
    const [px, py] = pathPoints[i];
    const segLen = Math.hypot(px - prevX, py - prevY);
    if (accumulated + segLen >= targetDist) {
      const frac = (targetDist - accumulated) / segLen;
      ballX = prevX + (px - prevX) * frac;
      ballY = prevY + (py - prevY) * frac;

      // Update info
      const pct = ((targetDist / totalLen) * 100).toFixed(1);
      document.getElementById('infoProgress').textContent =
        `${animPos}/${pathPoints.length} steps · ${pct}%`;

      draw();
      animId = requestAnimationFrame(animate);
      return;
    }
    accumulated += segLen;
    prevX = px; prevY = py;
    animPos = i;
  }

  // Fallback
  ballX = pathPoints[pathPoints.length - 1][0];
  ballY = pathPoints[pathPoints.length - 1][1];
  animating = false;
  setStatus('done');
  updateInfo();
  draw();
}

function pathLength() {
  let len = 0;
  for (let i = 1; i < pathPoints.length; i++) {
    len += Math.hypot(
      pathPoints[i][0] - pathPoints[i-1][0],
      pathPoints[i][1] - pathPoints[i-1][1]
    );
  }
  return len;
}

// ── UI helpers ─────────────────────────────────────────────
function setStatus(state) {
  const dot = document.getElementById('statusDot');
  const label = document.getElementById('statusLabel');
  dot.className = 'status-dot ' + state;
  label.textContent = state;
}

function updateInfo() {
  document.getElementById('infoCoords').textContent =
    `S (${pathPoints[0]?.[0]??'—'}, ${pathPoints[0]?.[1]??'—'}) → ` +
    `E (${pathPoints[pathPoints.length-1]?.[0]??'—'}, ${pathPoints[pathPoints.length-1]?.[1]??'—'})`;
}

// ── Fetch path from API ───────────────────────────────────
async function findPath(x1, y1, x2, y2) {
  setStatus('busy');
  document.getElementById('goBtn').disabled = true;

  try {
    const res = await fetch(`/api/path?x1=${x1}&y1=${y1}&x2=${x2}&y2=${y2}`);
    if (!res.ok) {
      const err = await res.json();
      alert(err.error || 'Request failed');
      setStatus('idle');
      return;
    }
    const data = await res.json();
    pathPoints = data.path;
    updateInfo();
    document.getElementById('infoProgress').textContent =
      `${data.length} path pixels`;
    startAnimation();
  } catch (e) {
    alert('Error: ' + e.message);
    setStatus('idle');
  } finally {
    document.getElementById('goBtn').disabled = false;
  }
}

// ── WebSocket connection (future multi-agent use) ────────
function connectWS() {
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${protocol}//${location.host}/ws`);
  ws.onopen = () => console.log('[WS] connected');
  ws.onclose = () => {
    console.log('[WS] closed, reconnecting in 3s');
    setTimeout(connectWS, 3000);
  };
  ws.onerror = () => ws?.close();
  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      // Future: handle multi-agent updates here
    } catch {}
  };
}

// ── Init ───────────────────────────────────────────────────
document.getElementById('goBtn').addEventListener('click', () => {
  const x1 = parseInt(document.getElementById('x1').value);
  const y1 = parseInt(document.getElementById('y1').value);
  const x2 = parseInt(document.getElementById('x2').value);
  const y2 = parseInt(document.getElementById('y2').value);
  findPath(x1, y1, x2, y2);
});

// Allow Enter key
document.querySelectorAll('#panel input').forEach(inp => {
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('goBtn').click();
  });
});

resize();
fitMap();
setStatus('idle');
connectWS();

// Fetch buildings
fetch('/api/buildings')
  .then(r => r.json())
  .then(data => {
    buildings = data;
    buildingsLoaded = true;
    draw();
  })
  .catch(() => {});

// Load default path on startup
document.getElementById('goBtn').click();

})();
</script>
</body>
</html>
